# Tokyo Night — deliberately restrained: native Sway transitions, no blur/shadows.
set $mod Mod4
set $bg #1a1b26
set $panel #24283b
set $fg #c0caf5
set $cyan #7dcfff
set $muted #565f89
set $red #f7768e

font pango:JetBrains Mono 10
gaps inner 8
gaps outer 4
default_border pixel 2
smart_borders on
client.focused $cyan $panel $fg $cyan $cyan
client.focused_inactive $muted $panel $fg $muted $muted
client.unfocused $muted $bg $muted $muted $muted
client.urgent $red $red $bg $red $red
client.background $bg
