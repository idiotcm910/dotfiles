# Restart these single-instance helpers safely whenever Sway reloads its config.
exec_always --no-startup-id sh -c 'pkill -x waybar || true; exec waybar'
exec_always --no-startup-id sh -c 'pkill -x mako || true; exec mako'
exec_always --no-startup-id sh -c 'pkill -x swayidle || true; exec swayidle -w timeout 600 "swaylock -f" timeout 900 "swaymsg output \"*\" dpms off" resume "swaymsg output \"*\" dpms on"'
