#================================FONT====================================
#========================================================================
font_family                     family="VictorMono Nerd Font Mono" style="Bold"
italic_font                     family="VictorMono Nerd Font Mono" style="Italic"
bold_font                       family="VictorMono Nerd Font Mono" style="Bold"
bold_italic_font                family="VictorMono Nerd Font Mono" style="Bold"
# NOTE: this is adjusted to match the line height so their is no extra space a the bottom of the window
font_size                       14
modify_font                     strikethrough_position 120%
modify_font                     strikethrough_thickness 250%
modify_font                     underline_position 125%
modify_font                     underline_thickness 3px
modify_font                     cell_height 150%
undercurl_style                 thin-dense

# disable ligatures when the cursor is over them so they are easier to edit
disable_ligatures               cursor

#===================================TAB BAR===============================
#=========================================================================
tab_bar_style                   separator
tab_separator                   "    "
tab_title_template              "{sup.index} {fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title}"
active_tab_title_template       "{sup.index} ❐ {fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title} {fmt.fg._5B6268}{fmt.nobold}({num_windows})"
tab_bar_edge                    top
tab_bar_align                   center
active_tab_font_style           italic

#--------------------------------------------------------------------------------
# Window layout {{{
#--------------------------------------------------------------------------------
remember_window_size            yes
enabled_layouts                 tall:bias=55;full_size=1,stack,fat,grid,horizontal
window_border_width             1.0
window_margin_width             0.0
window_padding_width            3
placement_strategy              top-left
# (static,scale,size)
resize_draw_strategy            scale

#================================INCLUDE==================================
include OneDark.conf

# Requires an X11 compositor.  Picom is started from Qtile's autostart file.
background_opacity 0.8
background_blur 20

shell_integration no-title
shell fish

# Ctrl+Shift+H (show_scrollback): default pager is `less`.
# Use nvim when less is missing; prefer less if installed (restore.sh).
scrollback_lines 20000
scrollback_pager nvim -R -c "setlocal buftype=nofile bufhidden=wipe nomodifiable noswapfile nolist nonumber norelativenumber" -c "normal! G" -
map ctrl+shift+h show_scrollback
# Jump to live prompt / end of scrollback (laptop-friendly; no Home/End keys)
map ctrl+alt+down scroll_end
map ctrl+alt+up scroll_home
map ctrl+shift+b scroll_end
map ctrl+shift+t scroll_home

# Wayland IME required for Fcitx5-Lotus in Kitty.
# Lotus uses Surrounding Text for kitty (see fcitx5/conf/lotus-app-rules.conf)
# so composition does not draw the white preedit box. Restart Kitty to apply.
wayland_enable_ime yes
