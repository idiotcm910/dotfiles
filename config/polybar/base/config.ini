include-file = ~/.config/polybar/base/colors.ini
include-file = ~/.config/polybar/base/modules/modules.ini
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
[global/wm]
margin-bottom = 5
margin-top = 5

[module/null]
type = custom/text
content = " "

[bar]
fill = ⏽
empty = ⏽

[bar/left]
override-redirect = true
width = 26%
height = 48

offset-y = 10
offset-x = 0.7%

border-size = 1
border-color = #3d89b4fa
background = ${color.background}
foreground = ${color.foreground}
radius = 16.0
padding = 1
module-margin-left = 2px
module-margin-right = 2px

font-0 = "Adwaita Mono:style=Regular:size=11;2"
font-1 = "Font Awesome 6 Pro:style=Regular:size=14;3"
font-2 = "Font Awesome 6 Pro:style=Regular:size=14;3"

modules-left = temperature sep cpu sep memory sep battery sep network

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[bar/sepRight]
override-redirect = true
width = 2%
height = 34
offset-y = 5
offset-x = 23.35%

border-color = #00000000
background = ${color.background}
radius-top = 18.0
radius-bottom = 18.0

modules-center = null

[bar/center]
override-redirect = true
fixed-center = true
alignment-center = true
width = 10%
height = 34

radius-top = 18.0

offset-y = 5
offset-x = 46%

;border-color = #00000000
background = ${color.background}
foreground = ${color.foreground}
border = 2
border-color = ${color.foreground}
module-margin-left = 1
module-margin-right = 1

font-0 = "Sofia Pro:size=11;1"
font-1 = "BitstreamVeraSansMono Nerd Font:size=16;2"
font-2 = "Font Awesome 6 Pro:size=13;3"

modules-center = title

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[bar/right]
override-redirect = true
width = 21%
height = 48

offset-y = 10
offset-x = 78.3%

border-size = 1
border-color = #3dcba6f7
background = ${color.background}
foreground = ${color.foreground}
radius = 16.0
padding = 1
module-margin-left = 2px
module-margin-right = 2px

font-0 = "Adwaita Mono:style=Regular:size=11;2"
font-1 = "Font Awesome 6 Pro:style=Regular:size=14;3"
font-2 = "Font Awesome 6 Pro:style=Regular:size=14;3"

modules-left = workspaces sep backlight sep pulseaudio sep date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[bar/sepLeft]
override-redirect = true
width = 2%
height = 34
offset-y = 5
offset-x = 71.65%

border-color = #00000000
background = ${color.background}
radius-top = 18.0
radius-bottom = 18.0

modules-center = null

[settings]
pseudo-transparency = true
