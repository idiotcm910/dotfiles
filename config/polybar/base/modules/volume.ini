[module/pulseaudio]
type = internal/pulseaudio

format-volume = ♪<label-volume>
format-volume-font = 1
format-volume-foreground = ${color.blue}

format-muted = ♪<label-muted>
format-muted-font = 1
format-muted-foreground = ${color.blue}

label-volume = %percentage%%
label-volume-font = 1
label-volume-foreground = ${color.foreground}
label-volume-padding = 5px

click-left = $HOME/.config/polybar/scripts/audio-menu.sh
click-right = pavucontrol
scroll-up = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
scroll-down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
