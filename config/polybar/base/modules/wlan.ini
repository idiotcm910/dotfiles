[module/wireless-network]
type = internal/network
interface = wlp0s20f3

[module/network]
type = internal/network
interface = wlp0s20f3
interface-type = wireless
interval = 3.0
udspeed-minwidth = 5
accumulate-stats = true
unknown-as-up = true
speed-unit = b/s

format-connected = ⌁<label-connected>
format-connected-font = 1
format-connected-foreground = ${color.green}

format-disconnected = ⌁<label-disconnected>
format-disconnected-font = 1
format-disconnected-foreground = ${color.green}

label-connected = Wi‑Fi
label-connected-foreground = ${color.foreground}
label-connected-font = 1
label-connected-padding = 5px

click-left = $HOME/.config/polybar/scripts/wifi-menu.sh
click-right = nmcli radio wifi off

label-disconnected = none
label-disconnected-foreground = ${color.foreground}
label-disconnected-font = 1
label-disconnected-padding = 5px
