[module/workspaces]
type = internal/xworkspaces

pin-workspaces = true

enable-click = true

enable-scroll = true

icon-0 = 1;1
icon-1 = 2;2
icon-2 = 3;3
icon-3 = 4;4
icon-4 = 5;5
; The Aurora design intentionally exposes the first five workspaces only.
; The remaining Qtile groups still exist and remain accessible by keyboard.
icon-5 = 6;⠀
icon-6 = 7;⠀
icon-7 = 8;⠀
icon-8 = 9;⠀

format = <label-state>
format-font = 3

label-active = %icon%
label-active-foreground = ${color.background}
label-active-background = ${color.mauve}
label-active-padding = 1

label-occupied = %icon%
label-occupied-foreground = ${color.lavender}

label-urgent = %icon%
label-urgent-foreground = ${color.foreground}

label-empty = %icon%
label-empty-foreground = ${color.foreground}

label-active-margin = 1px
label-urgent-margin = 1px
label-occupied-margin = 1px
label-empty-padding = 1px
