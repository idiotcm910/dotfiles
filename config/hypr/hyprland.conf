# Wayland-native Hyprland profile. No Xorg or XWayland is required.
monitor=,preferred,auto,1

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = GTK_IM_MODULE,ibus
env = QT_IM_MODULE,ibus
env = GLFW_IM_MODULE,ibus
env = ELECTRON_OZONE_PLATFORM_HINT,auto

exec-once = $HOME/.config/hypr/autostart.sh

input {
    kb_layout = us
    follow_mouse = 1
    touchpad { natural_scroll = true }
}

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgb(89b4fa) rgb(cba6f7) 45deg
    col.inactive_border = rgb(313244)
    layout = dwindle
}

decoration {
    rounding = 14
    active_opacity = 0.96
    inactive_opacity = 0.90
    blur { enabled = true; size = 5; passes = 2; vibrancy = 0.12 }
    shadow { enabled = true; range = 12; render_power = 3; color = rgba(00000055) }
}

animations {
    enabled = true
    bezier = soft, 0.25, 0.9, 0.25, 1.0
    animation = windows, 1, 5, soft, popin 86%
    animation = workspaces, 1, 5, soft, slidevert
    animation = border, 1, 6, soft
}

$mod = SUPER
bind = $mod, Return, exec, kitty
bind = $mod, D, exec, fuzzel
bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 0
bind = $mod, Space, togglefloating
bind = $mod, E, exec, thunar
bind = $mod SHIFT, L, exec, swaylock -f
bind = $mod SHIFT, A, exec, $HOME/.config/hypr/scripts/screenshot.sh area
bind = SHIFT, Print, exec, $HOME/.config/hypr/scripts/screenshot.sh full
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
