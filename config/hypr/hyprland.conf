# Wayland-native Hyprland profile. No Xorg or XWayland is required.
monitor=,preferred,auto,1

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = ELECTRON_OZONE_PLATFORM_HINT,auto

exec-once = $HOME/.config/hypr/autostart.sh

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgb(89b4fa) rgb(cba6f7) 45deg
    col.inactive_border = rgb(313244)
    layout = dwindle
}

misc {
    # Let the next focused window take over maximize/fullscreen in this workspace.
    on_focus_under_fullscreen = 1
}

decoration {
    rounding = 14
    active_opacity = 0.96
    inactive_opacity = 0.90
    blur {
        enabled = true
        size = 7
        passes = 3
        new_optimizations = true
        vibrancy = 0.18
        noise = 0.02
        contrast = 1.05
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = soft, 0.22, 0.85, 0.25, 1.0
    animation = windows, 1, 7, soft, popin 90%
    animation = windowsIn, 1, 7, soft, popin 86%
    animation = windowsOut, 1, 6, soft, popin 100%
    animation = workspaces, 1, 7, soft, slidefade
    animation = fade, 1, 6, soft
    animation = border, 1, 6, soft
}

# Window-specific polish. Rules are matched against the exact initial class.
windowrule = match:class ^(kitty)$, opacity 0.96 override 0.90 override 1.0 override
windowrule = match:class ^(kitty)$, rounding 14
windowrule = match:class ^(pavucontrol)$, float on, center on, size 720 560
windowrule = match:class ^(pavucontrol)$, opacity 0.98 override 0.94 override 1.0 override

$mod = SUPER
bind = $mod, Return, exec, kitty
bind = $mod, D, exec, fuzzel
bind = $mod, Q, killactive
bind = $mod, W, killactive
bind = $mod, F, fullscreen, 0
bind = $mod, M, fullscreen, 1
bind = $mod SHIFT, F, togglefloating
bind = $mod, Space, cyclenext
bind = $mod SHIFT, Space, cyclenext, prev
bind = $mod, Tab, layoutmsg, togglesplit
bind = $mod, E, exec, thunar
# Zoom mở cửa sổ họp ở workspace bất kỳ nên cần lối nhảy thẳng tới nó.
bind = $mod, Z, exec, hyprctl dispatch focuswindow class:zoom
# Copy link zoommtg:// rồi bấm để mở thẳng phòng họp.
bind = $mod SHIFT, Z, exec, $HOME/thai/system/bin/zoom-open
bind = $mod SHIFT, R, exec, fuzzel
bind = $mod ALT, L, exec, ~/.config/hypr/scripts/lock-screen.sh
bind = $mod SHIFT, A, exec, $HOME/.config/hypr/scripts/screenshot.sh area
bind = ALT SHIFT, A, exec, $HOME/.config/hypr/scripts/screenshot.sh area
bind = SHIFT, Print, exec, $HOME/.config/hypr/scripts/screenshot.sh full
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod CTRL, H, resizeactive, 40 0
bind = $mod CTRL, L, resizeactive, -40 0
bind = $mod CTRL, J, resizeactive, 0 40
bind = $mod CTRL, K, resizeactive, 0 -40
bind = $mod CTRL, R, exec, hyprctl reload
bind = $mod CTRL, Q, exit

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, $HOME/.config/hypr/scripts/mic-toggle.sh
bind = $mod CTRL, Up, exec, $HOME/.config/hypr/scripts/mic-volume.sh up
bind = $mod CTRL, Down, exec, $HOME/.config/hypr/scripts/mic-volume.sh down
